# Every secret comes from the environment. See .env.example and README.md.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mechanic}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.freemarker.expose-request-attributes=true

# Public URL of the app, used for links in e-mails
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Optional: creates/resets the "admin" account with this password on startup
app.admin.password=${ADMIN_PASSWORD:}
upload.path=${UPLOAD_PATH:./uploads}

spring.mail.host=${SPRING_MAIL_HOST:smtp.yandex.ru}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.protocol=smtps
mail.debug=${MAIL_DEBUG:false}
spring.mail.properties.mail.debug=${mail.debug}

recaptcha.secret=${RECAPTCHA_SECRET}

spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

server.error.whitelabel.enabled=false
